name: Deploy

# On every push to main: run the safety checks, then — only if they pass —
# deploy the sim site to Railway via the CLI. Auth is a Railway PROJECT TOKEN
# stored as the `RAILWAY_TOKEN` repo secret (the SAME bakery-bot project token,
# so this service lives in the bakery-bot Railway project). Mirror of
# bakery-bot/.github/workflows/deploy.yml.
#
# Setup (one-time):
#   1. Railway → the bakery-bot project → create the `nikke-sim` service.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions → add
#      `RAILWAY_TOKEN` = the same project token bakery-bot uses.
#   3. Keep the repo disconnected from the Railway service so only this drives deploys.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    name: verify (full gate)
    runs-on: ubuntu-latest
    # The full gate is minutes, not seconds. Well under the 360-min default, but
    # don't let a hang burn a runner (mirrors ci.yml).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Boards before the gate, so vitest's board-join tests run instead of
      # skipping — same rationale and same placement as ci.yml's step; see there
      # for why this is a workflow step rather than part of the `full` tier.
      - run: npm run dpschart && npm run ranks:all
      # THE gate for a production deploy (2026-08-01). This used to be a cheap
      # typecheck + `npm test` pre-flight, on the rationale that railway.json's
      # buildCommand (`verify.sh deploy`) re-ran the full gate inside the build
      # anyway. It no longer does — the Railway build is `verify.sh artifacts`,
      # build outputs only — because running ~576 CPU-seconds of vitest plus every
      # regression inside a deadline-bound build container was a direct contributor
      # to the BuildKit DeadlineExceeded failures. The gate has to live somewhere,
      # and a runner with a 30-minute budget is the right somewhere. It costs ~7 min
      # before `railway up`; if you pushed to main just to get the code onto main
      # and don't want to wait, cancel this workflow run — main is already updated.
      - run: bash scripts/verify.sh full
      # The artifacts tier — same command railway.json runs as its buildCommand, so a
      # broken board smoke fails HERE instead of after `railway up` has already started
      # (added 2026-08-02; see ci.yml's header for the two failures that motivated it).
      # Railway re-runs it during the build; that duplication is the point — this is the
      # early-fail copy.
      - run: bash scripts/verify.sh artifacts

  deploy:
    name: deploy to Railway
    needs: test # a red gate never deploys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      # Use the commit subject as the Railway deployment title. Read via
      # `git log` (NOT ${{ github.event.head_commit.message }}) so a crafted
      # commit message can't inject shell into the runner.
      - name: Capture commit message
        run: echo "DEPLOY_MSG=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"
      - name: Deploy sim
        run: railway up --ci --service "nikke-sim" --message "$DEPLOY_MSG"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
