name: CI

# Runs the safety checks on every PR into main and on pushes to main.
# Make these checks "required" in the branch ruleset so nothing merges red.
#
# Two tiers run here:
#   `verify.sh full`      — THE correctness gate (typecheck, validations, regressions,
#                           vitest, web build + client smoke).
#   `verify.sh artifacts` — the BUILD-OUTPUT tier: the DPS-chart and rank-board
#                           SMOKES, infographics pre-generation and the server bundle.
#                           On the deploy box (railway.json buildCommand) it also
#                           BUILDS the boards; PR CI sets SKIP_BOARD_BUILD and smokes
#                           the FETCHED boards instead (Step 0 of the artifact-
#                           decoupling plan — see the fetch step below).
# deploy.yml runs the same pair before `railway up` (there WITH the board build,
# as the hard pre-deploy gate), so a PR fails on exactly the step a deploy would.
#
# The artifacts tier was added to CI on 2026-08-02, after two failures reached a deploy
# that CI was green on. `verify.sh full` does not run web-smoke-ranks.mjs /
# web-smoke-dpschart.mjs at all — they are gated to the deploy/artifacts tiers — so a
# broken smoke had NO pre-deploy coverage anywhere. One of the two (a B1/B2 row index
# read as index 3 instead of 2) had been wrong since the morning it was written and
# had simply never executed.
#
# CI used to run only `npm test` (web build + client smoke, ~40s), so every other
# verify step (vitest, engine + control regression, doc-drift, sg-geometry,
# kit-status, …) was first exercised inside the Railway BUILD, i.e. after merge. On
# 2026-07-25 that let PR #22 merge green and then fail the deploy twice on generator
# unit tests. As of 2026-08-01 the Railway build no longer runs the gate at all —
# these runners are the only place it runs, which is why it must stay required.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: verify
    runs-on: ubuntu-latest
    # The full gate is minutes, not seconds — the generator unit tests alone are
    # ~3 min. Well under the 360-min default, but don't let a hang burn a runner.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Supply the rank boards BEFORE the gate, so vitest sees them (2026-08-01) —
      # since 2026-08-04 by FETCHING the published set instead of building it
      # (Step 0 of docs/handoffs/2026-08-03-artifact-store-decoupling-plan.md).
      # The build this replaced cost 472s on an engine PR (434s dpschart full
      # rebuild + ranks:all): the incremental skip gate cannot prove an engine
      # edit moved no unit's damage, so it correctly declines to fire there —
      # the rebuild WAS the step. Fetching turns it into ~1s.
      #
      # The board-join tests un-skip against the fetched set exactly as they did
      # against the built one: they are shape/join checks (slugs ⊆ roster, fixed
      # card geometry, rank/index consistency), not engine-vs-artifact value
      # parity, so a published artifact that is STALE w.r.t. the branch still
      # exercises them meaningfully. Staleness is self-healing: deploy.yml still
      # BUILDS the boards pre-deploy (the hard gate) and the Railway build
      # regenerates them from the merged branch, so a stale artifact is rebuilt
      # AT deploy time. Still a workflow step and not part of the `full` tier: a
      # fresh isolated engine worktree (CLAUDE.md constraint 8) must still be
      # able to run `verify.sh full` without boards present.
      - name: Fetch published board artifacts (Step 0 — no board build on PR CI)
        run: npx tsx scripts/fetch-published-boards.ts
      # Recomputes this branch's dpschart input hash (scripts/artifact-input-hash.ts,
      # the SSOT the builder shares) and compares it against the fetched artifact.
      # ADVISORY — never fails CI (owner decision 2026-08-04, plan §5/§8): it
      # names the drift and the refresh command, and the deploy path rebuilds.
      - name: Board freshness vs this branch (advisory)
        run: npx tsx scripts/check-board-freshness.ts

      # verify.sh runs `npm run typecheck` as its FIRST step and `npm run web:build`
      # + the client smoke (i.e. `npm test`) as its last, so this one step is a strict
      # superset of the two it replaced. Keep it as one step, not a flattened list:
      # verify.sh is the canonical gate (CLAUDE.md constraint 5) and a new check added
      # there must reach CI by existing, exactly as vitest's glob wires in test files.
      - name: Verify (typecheck · validations · regressions · unit tests · web smoke)
        run: bash scripts/verify.sh full

      # The tier the deploy box runs (railway.json buildCommand). Kept as its own step
      # so a red artifact smoke is legible as such instead of hiding inside the gate.
      # Step-0 difference: SKIP_BOARD_BUILD=1 skips the board builders inside the tier
      # — the boards were FETCHED above, not built. Everything else stays identical to
      # the deploy box, so a red smoke here still predicts a red Railway build. The
      # deploy path itself (deploy.yml + Railway) keeps BUILDING the boards: that
      # build is the hard freshness gate this fetch relies on.
      - name: Verify artifacts (board smokes · infographics · server bundle)
        run: bash scripts/verify.sh artifacts
        env:
          SKIP_BOARD_BUILD: 1
